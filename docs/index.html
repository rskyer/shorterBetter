<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shorter Better JS Model - Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #161b22;
            border-radius: 16px;
            padding: 48px 40px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        .header p {
            color: #8b949e;
            font-size: 16px;
        }

        .badge {
            display: inline-block;
            background: #238636;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .docs-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d1117;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid #21262d;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #c9d1d9;
        }

        .doc-item:hover {
            border-color: #58a6ff;
            background: #0d1117;
            transform: translateX(4px);
        }

        .doc-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .doc-icon {
            font-size: 22px;
        }

        .doc-name {
            font-weight: 500;
            font-size: 16px;
        }

        .doc-name small {
            color: #8b949e;
            font-weight: 400;
            font-size: 13px;
            margin-left: 8px;
        }

        .doc-arrow {
            color: #8b949e;
            font-size: 18px;
            transition: 0.2s;
        }

        .doc-item:hover .doc-arrow {
            color: #58a6ff;
            transform: translateX(4px);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #21262d;
            color: #8b949e;
            font-size: 14px;
        }

        .footer a {
            color: #58a6ff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: #8b949e;
        }

        .empty-state span {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 28px 18px;
            }

            .header h1 {
                font-size: 22px;
            }

            .doc-item {
                padding: 14px 16px;
                flex-wrap: wrap;
            }

            .doc-name {
                font-size: 14px;
            }

            .doc-name small {
                display: block;
                margin-left: 0;
                margin-top: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>📄 Shorter Better JS Model</h1>
            <p>Documentation &amp; Guides</p>
            <span class="badge">v1.0.0</span>
        </div>

        <!-- Docs List -->
        <div class="docs-list">

            <!-- Doc 1 -->
            <a href="https://rskyer.github.io/shorterBetter/docs/how-to-use.html" class="doc-item" target="_blank">
                <div class="doc-info">
                    <span class="doc-icon">📘</span>
                    <span class="doc-name">
                        How to Use
                        <small>Getting Started Guide</small>
                    </span>
                </div>
                <span class="doc-arrow">→</span>
            </a>

            <!-- More docs will appear here -->
            <!-- 
            <a href="link-to-doc-2.html" class="doc-item" target="_blank">
                <div class="doc-info">
                    <span class="doc-icon">📗</span>
                    <span class="doc-name">
                        API Reference
                        <small>Full API Documentation</small>
                    </span>
                </div>
                <span class="doc-arrow">→</span>
            </a>
            -->

        </div>

        <!-- Footer -->
        <div class="footer">
            Built with ❤️ by <a href="#">Skyer</a> &middot; 
            <a href="https://github.com/rskyer/shorterBetter" target="_blank">GitHub</a>
        </div>

    </div>

</body>
</html>
